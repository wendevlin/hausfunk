name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew assembleDebug testDebugUnitTest lint
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hausfunk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check that the tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version" >&2
            exit 1
          fi
      - name: Build signed release APK
        env:
          HAUSFUNK_KEYSTORE_BASE64: ${{ secrets.HAUSFUNK_KEYSTORE_BASE64 }}
          HAUSFUNK_KEYSTORE_PASSWORD: ${{ secrets.HAUSFUNK_KEYSTORE_PASSWORD }}
          HAUSFUNK_KEY_ALIAS: ${{ secrets.HAUSFUNK_KEY_ALIAS }}
          HAUSFUNK_KEY_PASSWORD: ${{ secrets.HAUSFUNK_KEY_PASSWORD }}
        run: |
          if [ -z "$HAUSFUNK_KEYSTORE_BASE64" ]; then
            echo "Signing secrets are missing; refusing to publish an unsigned APK" >&2
            exit 1
          fi
          export HAUSFUNK_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$HAUSFUNK_KEYSTORE_BASE64" | base64 -d > "$HAUSFUNK_KEYSTORE_FILE"
          ./gradlew assembleRelease
          rm "$HAUSFUNK_KEYSTORE_FILE"
          cp app/build/outputs/apk/release/app-release.apk "hausfunk-$GITHUB_REF_NAME.apk"
      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The release may already exist when the tag was created through GitHub's release page.
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "hausfunk-$GITHUB_REF_NAME.apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "hausfunk-$GITHUB_REF_NAME.apk" --title "$GITHUB_REF_NAME" --generate-notes
          fi
