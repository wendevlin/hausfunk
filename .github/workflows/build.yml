name: Build

on:
  push:
    branches: ["**"]
    # Release tags are the bare version, e.g. 0.1.1.
    tags: ["[0-9]*"]
  pull_request:
  # Builds and attaches the APK for an existing release tag, e.g. after the tag was created
  # while the release job could not run.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, e.g. 0.1.0
        required: true

env:
  # The tag being released (empty for branch and pull request builds).
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew assembleDebug testDebugUnitTest lint
      # Not zipped (archive: false), so the phone can install the download directly. The
      # artifact takes the file's name.
      - run: cp app/build/outputs/apk/debug/app-debug.apk hausfunk-debug.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: hausfunk-debug.apk
          archive: false
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check that the tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "$version" != "$RELEASE_TAG" ]; then
            echo "Tag $RELEASE_TAG does not match versionName $version" >&2
            exit 1
          fi
      - name: Build signed release APK
        env:
          HAUSFUNK_KEYSTORE_BASE64: ${{ secrets.HAUSFUNK_KEYSTORE_BASE64 }}
          HAUSFUNK_KEYSTORE_PASSWORD: ${{ secrets.HAUSFUNK_KEYSTORE_PASSWORD }}
          HAUSFUNK_KEY_ALIAS: ${{ secrets.HAUSFUNK_KEY_ALIAS }}
          HAUSFUNK_KEY_PASSWORD: ${{ secrets.HAUSFUNK_KEY_PASSWORD }}
        run: |
          if [ -z "$HAUSFUNK_KEYSTORE_BASE64" ]; then
            echo "Signing secrets are missing; refusing to publish an unsigned APK" >&2
            exit 1
          fi
          export HAUSFUNK_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$HAUSFUNK_KEYSTORE_BASE64" | base64 -d > "$HAUSFUNK_KEYSTORE_FILE"
          ./gradlew assembleRelease
          rm "$HAUSFUNK_KEYSTORE_FILE"
          cp app/build/outputs/apk/release/app-release.apk "hausfunk-$RELEASE_TAG.apk"
      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The release may already exist when the tag was created through GitHub's release page.
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "hausfunk-$RELEASE_TAG.apk" --clobber
          else
            gh release create "$RELEASE_TAG" "hausfunk-$RELEASE_TAG.apk" --title "$RELEASE_TAG" --generate-notes
          fi
